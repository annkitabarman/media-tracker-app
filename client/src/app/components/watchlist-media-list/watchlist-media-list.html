<div
  class="flex items-start gap-4 rounded-xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl text-white transition hover:border-violet-500/40 hover:bg-white/10"
>
  <!-- Poster -->
  <img
    [src]="item()?.poster"
    class="h-32 w-22 flex-shrink-0 rounded-lg object-cover shadow-lg"
  />

  <!-- Content -->
  <div class="flex flex-1 flex-col">
    <!-- Title -->
    <a
      [routerLink]="['/', item()?.mediaType, item()?.id]"
      class="text-lg font-semibold transition hover:text-violet-300 hover:underline"
    >
      {{ item()?.name }}
    </a>

    <!-- Metadata -->
    <div class="mt-1 flex flex-wrap items-center gap-2 text-xs text-gray-400">
      <span>{{ item()?.year | date:'yyyy' }}</span>
      <span>•</span>
      <span>{{ item()?.original_lang | uppercase }}</span>
      <span>•</span>
      <span>{{ mediatype }}</span>
    </div>

    <!-- Overview -->
    <p class="mt-3 line-clamp-3 text-xs leading-5 text-gray-300">
      {{ item()?.overview }}
    </p>

    <!-- Footer -->
    <div class="mt-auto flex justify-between items-center pt-4">
      <button
        (click)="toggleWatched()"
        class="flex items-center gap-2 rounded-lg bg-violet-700/60 px-3 py-2 text-xs transition hover:bg-violet-600"
      >
        <i
          class="fa-eye"
          [ngClass]="markAsWatched() ? 'fa-solid' : 'fa-regular'"
        ></i>

        {{ markAsWatched() ? 'Watched' : 'Mark as watched' }}
      </button>

      <button
        class="rounded-full p-2 text-pink-300 transition hover:bg-white/10"
      >
        <i class="fa-solid fa-heart"></i>
      </button>
    </div>
  </div>
</div>
