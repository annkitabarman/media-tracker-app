<div class="auto">
  <div class="flex items-center justify-between px-4 mt-4">
    <h2 class="text-4xl">Trending</h2>

    <!-- Toggle -->
    <div class="relative flex bg-gray-800 rounded-full p-1 text-sm w-fit">
      <!-- Sliding pill -->
      <div
        class="absolute top-1 left-1 h-[calc(100%-0.5rem)] w-[calc(50%-0.25rem)] bg-white rounded-full transition-all duration-300 ease-in-out"
        [ngClass]="trendType() === 'week' ? 'translate-x-full' : 'translate-x-0'"
      ></div>

      <!-- Daily -->
      <label class="relative z-10 cursor-pointer">
        <input
          type="radio"
          name="trend"
          value="day"
          class="hidden"
          [checked]="trendType() === 'day'"
          (change)="setTrend('day')"
        />
        <span
          class="px-4 py-1 inline-block transition-colors duration-300"
          [ngClass]="trendType() === 'day' ? 'text-black' : 'text-white'"
        >
          Daily
        </span>
      </label>

      <!-- Weekly -->
      <label class="relative z-10 cursor-pointer">
        <input
          type="radio"
          name="trend"
          value="week"
          class="hidden"
          [checked]="trendType() === 'week'"
          (change)="setTrend('week')"
        />
        <span
          class="px-4 py-1 inline-block transition-colors duration-300"
          [ngClass]="trendType() === 'week' ? 'text-black' : 'text-white'"
        >
          Weekly
        </span>
      </label>
    </div>
  </div>
  <app-media-row
    [mediaType]="'Movies'"
    [mediaList]="moviesList().slice(0,6)"
    [mediaLoading]="moviesLoading()"
    [mediaHasError]="moviesError()"
  />

  <app-media-row
    [mediaType]="'TV Shows'"
    [mediaList]="tvShowsList().slice(0,6)"
    [mediaLoading]="tvShowsLoading()"
    [mediaHasError]="tvShowsError()"
  />
</div>
