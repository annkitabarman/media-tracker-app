<div class="text-2xl my-4 px-4">{{mediaType()}}</div>

<div
  class="flex gap-x-4 h-[22rem] bg-[#31135c] rounded-md relative"
  [ngClass]="mediaHasError() ? 'items-center justify-center' : 'items-start'"
>
  @if(mediaHasError()) {
  <div
    class="flex items-center justify-center w-full bg-gray-300 mx-4 rounded-md"
  >
    <ng-lottie [options]="options" class="h-64"></ng-lottie>
  </div>
  } @else { @if(mediaLoading()) { @for(i of [1,2,3,4,5,6]; track i) {
  <div>
    <div
      class="w-40 h-64 mx-4 mt-4 rounded-md overflow-hidden bg-gray-300 animate-pulse"
    ></div>
    <div class="ml-5 ml-1 mt-2 w-40 truncate animate-pulse">...</div>
  </div>
  } } @else { @for(media of mediaList(); track media.id) {
  <app-media-card [item]="media" />
  } } }
</div>
