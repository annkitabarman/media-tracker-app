<div
  class="fixed inset-0 z-50 flex items-center justify-center p-8 bg-black/60 transition-opacity duration-300"
  [class.opacity-100]="isPopupOpen()"
  [class.opacity-0]="!isPopupOpen()"
  [class.pointer-events-auto]="isPopupOpen()"
  [class.pointer-events-none]="!isPopupOpen()"
>
  <div
    class="relative w-full max-w-4xl h-96 bg-slate-900 rounded-xl shadow-2xl overflow-hidden text-white text-xs py-10 px-10 transform transition-transform duration-300 ease-out"
    [class.scale-100]="isPopupOpen()"
    [class.scale-90]="!isPopupOpen()"
  >
    <i
      class="fa-solid fa-xmark absolute right-4 top-4 cursor-pointer hover:text-blue-500"
      (click)="closePopup()"
    ></i>

    <div class="flex items-center mx-10">
      <img [src]="mediaData()?.poster_path" class="block w-36 object-cover" />

      <div class="flex flex-col h-full w-full">
        <div class="w-full">
          <p class="text-xl mx-5 px-5 my-2">
            {{mediaData()?.name || mediaData()?.title}}
          </p>
          <hr class="border-white/20" />
        </div>

        <form [formGroup]="form" (ngSubmit)="addNewRating()">
          <div class="my-5 px-10 text-md flex items-start gap-20">
            <div class="relative">
              <p>Status</p>
              <button
                type="button"
                class="w-36 my-2 bg-slate-800 rounded-md text-left px-2 py-2 cursor-pointer"
                (click)="toggleDropdown($event)"
              >
                <div class="flex justify-between">
                  {{form.get('watchStatus')?.value}}
                  <i
                    class="fa-solid fa-chevron-down transition-transform duration-200"
                    [class.rotate-180]="isDropDownOpen()"
                  ></i>
                </div>
              </button>
              <div
                #dropdownWrapper
                class="absolute left-0 top-full bg-slate-800 overflow-y-auto transition-all duration-200 ease-out border-b border-r"
                [class.opacity-100]="isDropDownOpen()"
                [class.scale-y-100]="isDropDownOpen()"
                [class.translate-y-0]="isDropDownOpen()"
                [class.opacity-0]="!isDropDownOpen()"
                [class.scale-y-95]="!isDropDownOpen()"
                [class.-translate-y-2]="!isDropDownOpen()"
                [class.pointer-events-none]="!isDropDownOpen()"
                (click)="toggleDropdown($event)"
              >
                @for(i of watchStatusDropdown; track i) {
                <button
                  type="button"
                  class="cursor-pointer block py-2 hover:bg-slate-500 w-30 text-left px-5"
                  (click)="selectStatus(i)"
                >
                  {{i}}
                </button>
                }
              </div>
            </div>

            <div>
              Ratings
              <div class="my-2">
                <select
                  class="w-24 bg-slate-800 rounded-md py-2 px-2 outline-none cursor-pointer"
                  formControlName="rating"
                >
                  <option value="0">--</option>

                  @for (num of ratingOptions; track num) {
                  <option [value]="num">{{ num }}</option>
                  }
                </select>
              </div>
            </div>
          </div>

          <div class="px-10">
            Notes
            <div class="my-2">
              <textarea
                formControlName="notes"
                type="text"
                class="h-20 bg-slate-800 w-full"
              ></textarea>
            </div>
          </div>

          <div class="px-10 my-2">
            <button
              class="block bg-indigo-500 px-5 py-2 cursor-pointer rounded-sm"
              type="submit"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
