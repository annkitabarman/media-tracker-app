<div
  class="min-h-[calc(100vh-4rem)] flex flex-col px-4 sm:px-8 md:px-16 lg:px-28 py-6 sm:py-10 bg-linear-to-bl from-[#1e063d] to-violet-900"
>
  <div class="w-full max-w-6xl mx-auto">
    @if(searchResults()?.length) {

    <app-search-result-list
      [searchResult]="searchResults()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    />

    } @else {

    <div class="text-white text-xs">No items match your query</div>

    }
  </div>
</div>
