<div
  class="min-h-[calc(100vh-4rem)] flex gap-10 px-[5rem] xl:px-[15rem] pt-3 bg-linear-to-bl from-[#1e063d] to-violet-900"
>
  <div class="xl:w-78 md:w-52 shrink-0 py-4 text-gray-300">
    {{heading}}
    <app-discover-filter />
  </div>

  <div class="flex-1 flex min-w-0 justify-center">
    <div class="grid lg:grid-cols-4 xl:grid-cols-5 gap-6">
      @for(item of allMedia(); track item.id) {
      <app-media-card [item]="item"></app-media-card>
      }
    </div>
  </div>
</div>
