<div
  class="min-h-[calc(100vh-4rem)] flex gap-10 px-[5rem] xl:px-[15rem] pt-3 bg-linear-to-bl from-[#1e063d] to-violet-900"
>
  <div class="xl:w-78 md:w-52 shrink-0 py-4 text-gray-300">
    <div class="sticky top-25">
      <h3 class="mb-3">{{heading}}</h3>
      <app-discover-filter (emitFilters)="applyFilters($event)" />
    </div>
  </div>

  <div class="flex-1 min-w-0">
    @if(isLoading()) {
    <div class="grid lg:grid-cols-4 xl:grid-cols-5 gap-6">
      @for (_ of skeletonCards; track $index) {
      <div
        class="mx-4 mt-4 w-40 overflow-hidden rounded-xl bg-zinc-900 shadow-lg animate-pulse"
      >
        <div class="aspect-[2/3] w-full bg-violet-950"></div>

        <div class="bg-violet-900 p-3">
          <div class="h-3 w-3/4 rounded bg-violet-700"></div>

          <div class="mt-3 h-2 w-1/2 rounded bg-violet-800"></div>
        </div>
      </div>
      }
    </div>
    } @else {

    <div class="grid lg:grid-cols-4 xl:grid-cols-5 gap-6">
      @for (item of allMedia(); track item.id) {
      <app-media-card [type]="type()" [item]="item"></app-media-card>
      }
    </div>

    @if(hasMoreMedia && !isLoading) {
    <button
      class="my-5 mx-3 w-full rounded-lg bg-violet-600 py-2 text-sm font-semibold text-white transition-all duration-200 hover:cursor-pointer hover:bg-violet-500 hover:shadow-lg hover:shadow-violet-900/30 active:scale-[0.98]"
      (click)="fetchDiscovery()"
    >
      Load More
    </button>
    } }
  </div>
</div>
