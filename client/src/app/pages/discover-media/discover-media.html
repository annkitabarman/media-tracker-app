<div
  class="min-h-[calc(100vh-4rem)] flex gap-3 sm:gap-6 px-2 sm:px-4 lg:px-8 xl:px-20 2xl:px-40 pt-3 bg-linear-to-bl from-[#1e063d] to-violet-900 py-10"
>
  <!-- Sidebar -->
  <div class="w-24 sm:w-40 lg:w-60 shrink-0 py-4 text-gray-300">
    <div
      class="sticky top-25 max-h-[calc(100vh-7rem)] overflow-y-auto clean-scrollbar"
    >
      <h3 class="mb-3 text-sm sm:text-base">{{ heading }}</h3>

      <app-discover-filter (emitFilters)="applyFilters($event)" />
    </div>
  </div>

  <!-- Media List -->
  <div class="flex-1 min-w-0">
    @if(isLoading()) {
    <div
      class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5"
    >
      @for (_ of skeletonCards; track $index) {
      <div
        class="w-full overflow-hidden rounded-xl bg-zinc-900 shadow-lg animate-pulse"
      >
        <div class="aspect-[2/3] w-full bg-violet-950"></div>

        <div class="bg-violet-900 p-2 sm:p-3">
          <div class="h-3 w-3/4 rounded bg-violet-700"></div>
          <div class="mt-3 h-2 w-1/2 rounded bg-violet-800"></div>
        </div>
      </div>
      }
    </div>
    } @else {
    <div
      class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5"
    >
      @for (item of allMedia(); track item.id) {
      <app-media-card [type]="type()" [item]="item" />
      }
    </div>

    @if(hasMoreMedia && !isLoading()) {
    <button
      class="my-5 mx-5 w-full rounded-lg bg-violet-600 py-2 text-sm font-semibold text-white hover:bg-violet-500 hover:cursor-pointer"
      (click)="fetchDiscovery()"
    >
      Load More
    </button>
    } }
  </div>
</div>
